# ==============================================================================
# RIDIS — Sistema de Gestão de Discos USB, Matrizes e Relatórios
# CONFIGURAÇÃO NGINX DE PRODUÇÃO (REVERSE PROXY & SEGURANÇA REFORÇADA)
# Conformidade: ISO/IEC 27001:2022 (A.8.20, A.8.24, A.8.26) & NIS 2 (Art. 21.º)
# Localização recomendada no SO: /etc/nginx/sites-available/ridis.conf
# ==============================================================================

# Definição de zonas de limitação de taxa (Rate Limiting para proteção DoS / Brute-force)
limit_req_zone $binary_remote_addr zone=ridis_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ridis_login_limit:10m rate=5r/m;

# Upstream para a aplicação RIDIS (Node.js / Express em porta 3005)
upstream ridis_backend {
    server 127.0.0.1:3005 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. Redirecionamento Obrigatório HTTP -> HTTPS (ISO 27001 A.8.24 / NIS 2 Cifragem em trânsito)
server {
    listen 80;
    listen [::]:80;
    server_name ridis.dglab.gov.pt _; # Substituir pelo FQDN atribuído

    # Desativar identificação do servidor para redução de superfície de ataque
    server_tokens off;

    # Redirecionamento permanente para canal cifrado
    return 301 https://$host$request_uri;
}

# 2. Servidor Principal HTTPS com TLS 1.3 e Cabeçalhos de Segurança Estritos
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ridis.dglab.gov.pt;

    server_tokens off;

    # Certificados TLS (Let's Encrypt ou PKI Institucional da DGLAB / Administração Pública)
    ssl_certificate /etc/ssl/certs/ridis_dglab.crt;
    ssl_certificate_key /etc/ssl/private/ridis_dglab.key;

    # Protocolos e Cifras Criptográficas Fortes (Apenas TLS 1.2 e TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # Otimização de Sessão SSL com Proteção contra Replay
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeçalhos de Segurança HTTP (Alinhamento ISO 27001 e Boas Práticas OWASP)
    # HSTS - Strict Transport Security (Força HTTPS durante 1 ano com subdomínios)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Proteção contra Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevenção de MIME-Type Confusion
    add_header X-Content-Type-Options "nosniff" always;
    # Política de Referrer para proteção de dados internos
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restrição de APIs de Hardware no browser
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Content Security Policy (Proteção contra XSS)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    # Limite de tamanho de upload (Permite relatórios volumosos até 50MB)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Logs de Acesso e Erros com Formato Estruturado para Auditoria NIS 2
    access_log /var/log/nginx/ridis_access.log combined buffer=16k flush=5s;
    error_log /var/log/nginx/ridis_error.log warn;

    # Proteção de endpoints de autenticação contra ataques de força bruta
    location = /api/login {
        limit_req zone=ridis_login_limit burst=5 nodelay;

        proxy_pass http://ridis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para API geral com rate limiting
    location /api/ {
        limit_req zone=ridis_api_limit burst=50 nodelay;

        proxy_pass http://ridis_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para operações de importação e processamento de ficheiros
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Raiz da Aplicação e Ficheiros Estáticos
    location / {
        proxy_pass http://ridis_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloqueio de Acesso a Ficheiros Ocultos e Repositório Git (.git, .env)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
